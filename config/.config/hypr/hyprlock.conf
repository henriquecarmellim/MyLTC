# MyLTC — tela de bloqueio (hyprlock)
# Paleta latenci.in: #ff2d39 · #ff5b64 · #ff858c sobre #0c0c0f

$red    = rgba(ff2d39ff)
$soft   = rgba(ff858cff)
$text   = rgba(f4f4f5ff)
$muted  = rgba(a0a0aaff)
$bg     = rgba(0c0c0fcc)
$font   = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
}

auth {
    fingerprint:enabled = false
}

background {
    monitor =
    path = ~/Pictures/wallpapers/japan-9mdyz8.png
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.15
}

# Hora grande em vermelho
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $red
    font_size = 120
    font_family = $font ExtraBold
    position = 0, 190
    halign = center
    valign = center
}

# Data em português
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/data-ptbr
    color = $text
    font_size = 16
    font_family = $font
    position = 0, 85
    halign = center
    valign = center
}

# Usuário
label {
    monitor =
    text =   $USER
    color = $muted
    font_size = 13
    font_family = $font
    position = 0, -35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 14
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = $red
    inner_color = $bg
    font_color = $text
    font_family = $font
    check_color = $soft
    fail_color = $red
    capslock_color = rgba(e6b450ff)
    fade_on_empty = false
    placeholder_text = <span foreground="##a0a0aa">󰌾  senha</span>
    fail_text = <span foreground="##ff2d39">senha errada ($ATTEMPTS)</span>
    position = 0, -100
    halign = center
    valign = center
}

# Bateria + layout do teclado no rodapé
label {
    monitor =
    text = cmd[update:10000] echo "󰁹 $(cat /sys/class/power_supply/BAT*/capacity)%   󰌌 $LAYOUT"
    color = $muted
    font_size = 11
    font_family = $font
    position = 0, 40
    halign = center
    valign = bottom
}
