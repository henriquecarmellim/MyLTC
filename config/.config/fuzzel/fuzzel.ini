# Launcher (Super) — cores do latenci.in, feito para usar no teclado
[main]
font=JetBrainsMono Nerd Font:size=11
prompt="󰣇  "
icon-theme=hicolor
lines=10
width=42
horizontal-pad=18
vertical-pad=14
inner-pad=8
line-height=22
layer=overlay
# ancorado embaixo: o Hyprland anima subindo
anchor=bottom
y-margin=12
terminal=foot -e
fields=name,generic,keywords,categories,filename

[colors]
# formato RRGGBBAA
background=0c0c0fe6
text=a0a0aaff
prompt=ff2d39ff
placeholder=5c5c66ff
input=f4f4f5ff
match=ff5b64ff
selection=43141aff
selection-text=f4f4f5ff
selection-match=ff858cff
counter=5c5c66ff
border=ff2d39cc

[border]
width=1
radius=12

[key-bindings]
# Ctrl+J/N desce e Ctrl+P sobe, além das setas (Ctrl+K já apaga a linha)
next=Down Control+j Control+n
prev=Up Control+p
