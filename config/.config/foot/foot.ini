# Terminal do note — translúcido (o Hyprland desfoca o fundo), paleta do latenci.in
shell=sh -c "command -v fish >/dev/null && exec fish || exec bash"
font=JetBrainsMono Nerd Font:size=11
pad=14x12
dpi-aware=no

[cursor]
style=beam
blink=yes

[mouse]
hide-when-typing=yes

[colors-dark]
alpha=0.80
background=0c0c0f
foreground=f4f4f5
cursor=0c0c0f ff2d39
selection-foreground=f4f4f5
selection-background=43141a

# preto, vermelho, verde, amarelo, azul, magenta, ciano, branco
regular0=1c1c21
regular1=ff2d39
regular2=7ec699
regular3=e6b450
regular4=8da4c7
regular5=ff5b64
regular6=89b8c2
regular7=a0a0aa

bright0=2a2a30
bright1=ff5b64
bright2=9fd8b0
bright3=f0c674
bright4=a9bce0
bright5=ff858c
bright6=a3d0d8
bright7=f4f4f5
